<script>
    const supabaseUrl = 'https://aiojzwzykvuaxepfjwhr.supabase.co';
    const supabaseKey = 'sb_publishable_jZmHhXFrFBvpqGRjqBlBEg_uZ_TtQyA';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    const profile = JSON.parse(localStorage.getItem('scout_profile') || '{}');
    const userEmail = profile.email || 'anonymous_user@scout.local';

    let uploadCount = 0;
    const monthlyLimit = 20;
    const currentMonthStr = new Date().toISOString().substring(0, 7);

    async function syncServerProfile() {
        try {
            let { data, error } = await db.from('profiles').select('*').eq('email', userEmail).maybeSingle();
            
            if (!data) {
                const { data: newProfile } = await db.from('profiles').insert([{
                    email: userEmail,
                    upload_count: 0,
                    upload_month: currentMonthStr,
                    right_swipes: 0,
                    swipe_date: new Date().toISOString().split('T')[0]
                }]).select().maybeSingle();
                data = newProfile;
            }

            if (data) {
                if (data.upload_month !== currentMonthStr) {
                    await db.from('profiles').update({ upload_count: 0, upload_month: currentMonthStr }).eq('email', userEmail);
                    uploadCount = 0;
                } else {
                    uploadCount = data.upload_count || 0;
                }
            }
        } catch (e) {
            console.log("Profile sync fallback active:", e);
        }
        document.getElementById('uploadCounterBadge').innerText = `Monthly Limit: ${uploadCount}/${monthlyLimit}`;
    }
    syncServerProfile();

    let isBoostActive = false;

    window.setBoostMode = function(boosted) {
        isBoostActive = boosted;
        const standardBtn = document.getElementById('standardOptionBtn');
        const boostBtn = document.getElementById('boostOptionBtn');
        const sliderContainer = document.getElementById('boostSliderContainer');

        if (boosted) {
            boostBtn.className = "bg-[#bcf53f] text-[#121214] font-black text-xs uppercase tracking-wider py-2.5 rounded-xl transition cursor-pointer";
            standardBtn.className = "bg-zinc-900 text-zinc-400 hover:text-white font-bold text-xs uppercase tracking-wider py-2.5 rounded-xl border border-zinc-800 transition cursor-pointer";
            sliderContainer.classList.remove('hidden');
        } else {
            standardBtn.className = "bg-[#bcf53f] text-[#121214] font-black text-xs uppercase tracking-wider py-2.5 rounded-xl transition cursor-pointer";
            boostBtn.className = "bg-zinc-900 text-zinc-400 hover:text-white font-bold text-xs uppercase tracking-wider py-2.5 rounded-xl border border-zinc-800 transition cursor-pointer";
            sliderContainer.classList.add('hidden');
        }
    }

    window.updateBoostCost = function(days) {
        document.getElementById('sliderDaysLabel').innerText = `${days} Day${days > 1 ? 's' : ''}`;
        const cost = (days * 0.10).toFixed(2);
        document.getElementById('sliderCostLabel').innerText = `£${cost}`;
    }

    const publishBtn = document.getElementById('publishBtn');

    publishBtn.addEventListener('click', async () => {
        const title = document.getElementById('itemTitle').value.trim();
        let rawPrice = document.getElementById('itemPrice').value.trim();
        const external_link = document.getElementById('itemLink').value.trim();

        if (!title || !rawPrice || !external_link) {
            alert("Please fill in the title, price, and marketplace link.");
            return;
        }

        if (uploadCount >= monthlyLimit) {
            document.getElementById('uploadPaywallModal').classList.remove('hidden');
            return;
        }

        executeUpload();
    });

    window.payForListing = function() {
        if (confirm("Confirm 49p payment for extra monthly listing slot?")) {
            document.getElementById('uploadPaywallModal').classList.add('hidden');
            executeUpload();
        }
    }

    window.closeUploadPaywall = function() {
        document.getElementById('uploadPaywallModal').classList.add('hidden');
    }

    async function executeUpload() {
        publishBtn.innerText = "Launching to Deck...";
        publishBtn.disabled = true;

        const title = document.getElementById('itemTitle').value.trim();
        let rawPrice = document.getElementById('itemPrice').value.trim();
        const location = document.getElementById('itemLocation').value.trim();
        const imageFileInput = document.getElementById('itemImageFile');
        const external_link = document.getElementById('itemLink').value.trim();
        const isAgeRestricted = document.getElementById('isAgeRestricted').checked;

        let boostExpiresAt = null;
        if (isBoostActive) {
            const days = parseInt(document.getElementById('boostDaysSlider').value);
            const boostCost = (days * 0.10).toFixed(2);
            if (confirm(`🔒 Secure Checkout\n\nConfirm payment of £${boostCost} to boost this post for ${days} day${days > 1 ? 's' : ''}?`)) {
                const expiry = new Date();
                expiry.setDate(expiry.getDate() + days);
                boostExpiresAt = expiry.toISOString();
            } else {
                publishBtn.innerText = "Launch to Swipe Deck 🚀";
                publishBtn.disabled = false;
                return;
            }
        }

        rawPrice = rawPrice.replace('£', '').trim();
        const finalPrice = isNaN(parseFloat(rawPrice)) ? rawPrice : `£${parseFloat(rawPrice).toFixed(2)}`;

        let imageUrl = 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80';

        if (imageFileInput.files && imageFileInput.files[0]) {
            const file = imageFileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            
            const { error: uploadError } = await db.storage.from('item-images').upload(fileName, file);
            if (uploadError) {
                alert("Image upload failed. Please try again.");
                publishBtn.innerText = "Launch to Swipe Deck 🚀";
                publishBtn.disabled = false;
                return;
            }

            const { data: publicUrlData } = db.storage.from('item-images').getPublicUrl(fileName);
            imageUrl = publicUrlData.publicUrl;
        }

        const newItem = {
            title,
            price: finalPrice,
            location,
            image_url: imageUrl,
            external_link,
            user_email: userEmail,
            is_restricted: isAgeRestricted,
            is_boosted: !!boostExpiresAt,
            boost_expires_at: boostExpiresAt,
            embedding: null,
            created_at: new Date().toISOString()
        };

        const { error: insertError } = await db.from('items').insert([newItem]);

        if (insertError) {
            alert("Error launching listing. Please try again.");
            publishBtn.innerText = "Launch to Swipe Deck 🚀";
            publishBtn.disabled = false;
        } else {
            uploadCount++;
            await db.from('profiles').update({ upload_count: uploadCount }).eq('email', userEmail);

            alert("Bargain launched successfully! 🚀");
            window.location.href = 'swipe.html';
        }
    }
</script>
