<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCOUT — Discover Local Bargains</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { scout: { dark: '#121214', card: '#1e1e22', neon: '#C6FF00', neonhover: '#adff2f' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121214">
    <style>body { background-color: #0d0d0d; -webkit-tap-highlight-color: transparent; } .phone-container { max-width: 430px; min-height: 100vh; background-color: #121214; margin: 0 auto; position: relative; padding-bottom: 90px; overflow-x: hidden; }</style>
</head>
<body class="text-white font-sans antialiased">
    <div class="phone-container flex flex-col">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center px-6 pt-8 pb-6">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-scout-neon rounded-2xl flex items-center justify-center text-scout-dark text-2xl shadow-lg">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <div>
                    <h1 class="font-black tracking-wide text-2xl text-white leading-none">SCOUT</h1>
                    <span class="text-xs font-semibold text-scout-neon tracking-wide block mt-1">Find Your Next Something.</span>
                </div>
            </div>
            <a href="profile.html" class="text-white text-2xl hover:text-scout-neon transition"><i class="fa-regular fa-circle-user"></i></a>
        </header>

        <!-- SEARCH -->
        <div class="px-6 mb-5">
            <div class="flex bg-scout-card rounded-2xl p-4 items-center focus-within:ring-1 focus-within:ring-scout-neon transition shadow-md">
                <i class="fa-solid fa-magnifying-glass text-zinc-400 text-lg mr-3"></i>
                <input type="text" id="aiSearchInput" placeholder="What are you hunting for?" class="w-full bg-transparent text-base text-white placeholder-zinc-500 focus:outline-none" onkeypress="if(event.key === 'Enter') triggerAISearch()" />
            </div>
        </div>

        <!-- SURPRISE ME BUTTON -->
        <div class="px-6 mb-5">
            <button onclick="triggerSurpriseMe()" class="w-full bg-scout-neon hover:bg-scout-neonhover text-scout-dark rounded-2xl py-6 flex flex-col items-center justify-center shadow-lg transition active:scale-95 cursor-pointer">
                <i class="fa-solid fa-shuffle text-2xl mb-2"></i>
                <h2 class="text-2xl font-black tracking-tight mb-1">SURPRISE ME</h2>
                <p class="text-sm font-semibold text-scout-dark/80">Discover your next bargain</p>
            </button>
        </div>

        <!-- ACTION GRID -->
        <div class="px-6 grid grid-cols-2 gap-4 mb-6">
            <a href="radars.html" class="bg-scout-card rounded-2xl p-5 block transition active:scale-95 shadow-md">
                <i class="fa-solid fa-bullseye text-scout-neon text-2xl mb-3 block"></i>
                <h3 class="text-lg font-bold text-white mb-1">My Radars</h3>
                <p class="text-xs text-zinc-400">Track things you want</p>
            </a>
            <a href="finds.html" class="bg-scout-card rounded-2xl p-5 block transition active:scale-95 shadow-md">
                <i class="fa-regular fa-heart text-scout-neon text-2xl mb-3 block"></i>
                <h3 class="text-lg font-bold text-white mb-1">My Finds</h3>
                <p class="text-xs text-zinc-400">Your saved bargains</p>
            </a>
        </div>

        <!-- PLAIN TEXT SELLING PROMO -->
        <div class="px-6 mb-4">
            <div class="border-2 border-scout-neon rounded-2xl p-5 shadow-lg">
                <h3 class="text-lg font-bold text-white flex items-center mb-2">
                    <i class="fa-solid fa-tags text-scout-neon mr-2"></i> Selling something?
                </h3>
                <p class="text-sm text-zinc-400 leading-relaxed mb-4">
                    Add your eBay, Facebook Marketplace, Amazon or Vinted listing link to help potential buyers discover it.
                </p>
                <a href="add.html" class="text-scout-neon font-black text-sm uppercase tracking-wide flex items-center hover:text-scout-neonhover transition">
                    ADD YOUR LISTING <i class="fa-solid fa-arrow-right ml-2"></i>
                </a>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="fixed bottom-0 w-full max-w-[430px] h-20 bg-scout-dark/95 backdrop-blur-md border-t border-zinc-900 flex justify-around items-center px-2 z-50">
            <a href="index.html" class="flex flex-col items-center space-y-1 text-scout-neon">
                <i class="fa-solid fa-compass text-xl"></i>
                <span class="text-[10px] font-bold tracking-tight">Discover</span>
            </a>
            <a href="finds.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-regular fa-heart text-xl"></i>
                <span class="text-[10px] font-semibold tracking-tight">Finds</span>
            </a>
            <a href="radars.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-bullseye text-xl"></i>
                <span class="text-[10px] font-semibold tracking-tight">Radars</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-regular fa-user text-xl"></i>
                <span class="text-[10px] font-semibold tracking-tight">Profile</span>
            </a>
        </nav>
    </div>

    <script>
        const supabaseUrl = 'https://aiojzwzykvuaxepfjwhr.supabase.co';
        const supabaseKey = 'sb_publishable_jZmHhXFrFBvpqGRjqBlBEg_uZ_TtQyA';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        window.triggerAISearch = function() {
            const query = document.getElementById('aiSearchInput').value.trim();
            if (!query) { window.location.href = 'swipe.html'; return; }
            window.location.href = `swipe.html?q=${encodeURIComponent(query)}`;
        }

        window.triggerSurpriseMe = async function() {
            const { data: items } = await db.from('items').select('*');
            if (!items || items.length === 0) { window.location.href = 'swipe.html'; return; }

            const profile = JSON.parse(localStorage.getItem('scout_profile') || '{}');
            const interests = profile.interests ? profile.interests.split(',').map(i => i.trim().toLowerCase()) : ['cars', 'tools', 'wood'];

            const matchedItems = items.filter(item => {
                const title = (item.title || '').toLowerCase();
                return interests.some(interest => title.includes(interest));
            });

            const pool = (matchedItems.length > 0) ? matchedItems : items;
            const randomItem = pool[Math.floor(Math.random() * pool.length)];
            const searchKeyword = randomItem ? randomItem.title.split(' ')[0] : '';
            window.location.href = `swipe.html?q=${encodeURIComponent(searchKeyword)}`;
        }
    </script>
</body>
</html>
