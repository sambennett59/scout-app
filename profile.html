<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOUT — My Boosts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { background-color: #0d0d0d; overflow-x: hidden; }
        .phone-container {
            max-width: 430px; min-height: 100vh;
            background-color: #121214; box-shadow: 0 0 24px rgba(0,0,0,0.8);
            margin: 0 auto; position: relative; padding-bottom: 110px;
        }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <div class="phone-container flex flex-col">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center px-6 pt-6 pb-4">
            <button onclick="history.back()" class="text-zinc-400 hover:text-white text-xl cursor-pointer"><i class="fa-solid fa-chevron-left"></i></button>
            <h1 class="text-lg font-black tracking-tight text-[#bcf53f]">MY BOOSTS</h1>
            <a href="setup.html" class="text-xs font-bold text-[#bcf53f] hover:underline">Edit Account</a>
        </header>

        <!-- MAIN CONTENT -->
        <main class="px-6 py-4 flex-grow space-y-6">
            
            <!-- USER CARD -->
            <div class="bg-[#1e1e22] border border-zinc-800 rounded-3xl p-6 text-center space-y-4 shadow-lg">
                <div class="relative w-24 h-24 mx-auto">
                    <div id="avatarContainer" class="w-24 h-24 bg-[#bcf53f]/10 border-2 border-[#bcf53f] rounded-full flex items-center justify-center overflow-hidden shadow-inner cursor-pointer" onclick="document.getElementById('avatarFileInput').click()">
                        <img id="profileAvatarImg" src="" alt="Avatar" class="w-full h-full object-cover hidden" />
                        <i id="profileAvatarIcon" class="fa-solid fa-user text-[#bcf53f] text-3xl"></i>
                    </div>
                    <button onclick="document.getElementById('avatarFileInput').click()" class="absolute bottom-0 right-0 w-8 h-8 bg-[#bcf53f] hover:bg-[#adff2f] text-[#121214] rounded-full flex items-center justify-center shadow-md border-2 border-[#121214] transition cursor-pointer">
                        <i class="fa-solid fa-plus text-xs font-black"></i>
                    </button>
                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="uploadAvatar(event)" />
                </div>

                <div>
                    <h2 id="profileName" class="text-xl font-black text-white capitalize">sam bennett</h2>
                    <p id="profileEmail" class="text-xs text-[#bcf53f] font-semibold mt-0.5">samjbennett597@gmail.com</p>
                    <p id="profileLocation" class="text-xs text-zinc-400 mt-1"><i class="fa-solid fa-location-dot mr-1 text-[#bcf53f]"></i> Crediton, Devon</p>
                </div>
            </div>

            <!-- MY BOOSTS SECTION -->
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-[#bcf53f]">🚀 Active Boosts</h3>
                    <a href="add.html" class="text-[10px] font-bold text-[#bcf53f] hover:underline">+ New Boosted Post</a>
                </div>
                <div id="myBoostsContainer" class="space-y-3">
                    <div class="bg-[#1e1e22] border border-zinc-800 rounded-2xl p-4 text-center text-xs text-zinc-500">
                        Loading your boosts...
                    </div>
                </div>
            </div>

            <!-- LOGOUT & RESET -->
            <div class="space-y-2 pt-2">
                <button onclick="logoutUser()" class="w-full bg-[#1e1e22] hover:bg-zinc-800 text-zinc-300 border border-zinc-800 font-bold uppercase tracking-wider py-3.5 rounded-2xl transition text-xs flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </button>
                <button onclick="clearLocalStorage()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-bold uppercase tracking-wider py-3.5 rounded-2xl transition text-xs flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Clear Cache</span>
                </button>
            </div>

        </main>

        <!-- EXTEND BOOST MODAL -->
        <div id="extendBoostModal" class="fixed inset-0 bg-[#121214]/95 backdrop-blur-md z-[100] flex flex-col items-center justify-center p-6 text-center space-y-4 hidden">
            <div class="w-16 h-16 bg-[#bcf53f]/10 border-2 border-[#bcf53f]/30 text-[#bcf53f] rounded-3xl flex items-center justify-center text-3xl shadow-lg">
                <i class="fa-solid fa-rocket"></i>
            </div>
            <div class="space-y-1">
                <h2 class="text-xl font-black text-white">Renew Boost</h2>
                <p class="text-xs text-zinc-400 px-2">Extend your boost to keep your item pinned near the front. 10p per day.</p>
            </div>

            <div class="w-full bg-[#1e1e22] border border-zinc-800 rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-zinc-400">Additional Days:</span>
                    <span id="extendDaysLabel" class="text-[#bcf53f] text-sm">1 Day</span>
                </div>
                <input type="range" id="extendDaysSlider" min="1" max="30" value="1" oninput="updateExtendCost(this.value)" class="w-full accent-[#bcf53f] cursor-pointer" />
                <div class="flex justify-between items-center pt-2 border-t border-zinc-800 text-sm">
                    <span class="font-bold text-zinc-300">Total Price:</span>
                    <span id="extendCostLabel" class="font-black text-[#bcf53f] text-base">£0.10</span>
                </div>
            </div>

            <button onclick="confirmExtendBoost()" class="w-full bg-[#bcf53f] hover:bg-[#adff2f] text-[#121214] font-black uppercase tracking-wider py-3.5 rounded-2xl shadow-lg transition text-xs cursor-pointer">
                Pay & Renew Boost 🚀
            </button>
            <button onclick="closeExtendModal()" class="w-full bg-[#1e1e22] text-zinc-400 font-bold uppercase tracking-wider py-3.5 rounded-2xl border border-zinc-800 text-xs cursor-pointer">
                Cancel
            </button>
        </div>

        <!-- BOTTOM TAB NAVIGATION -->
        <nav class="fixed bottom-0 w-full max-w-[430px] h-20 bg-[#121214]/90 backdrop-blur-md border-t border-zinc-900/80 flex justify-around items-center px-4 z-50">
            <a href="index.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-compass text-lg"></i>
                <span class="text-[10px] font-semibold tracking-tight">Discover</span>
            </a>
            <a href="finds.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-[10px] font-semibold tracking-tight">Finds</span>
            </a>
            <a href="radars.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-bullseye text-lg"></i>
                <span class="text-[10px] font-semibold tracking-tight">Radars</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center space-y-1 text-[#bcf53f]">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-bold tracking-tight">Profile</span>
            </a>
        </nav>

    </div>

    <script>
        const supabaseUrl = 'https://aiojzwzykvuaxepfjwhr.supabase.co';
        const supabaseKey = 'sb_publishable_jZmHhXFrFBvpqGRjqBlBEg_uZ_TtQyA';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let profile = JSON.parse(localStorage.getItem('scout_profile') || '{}');
        if (profile.email && !profile.loggedIn) {
            profile.loggedIn = true;
            localStorage.setItem('scout_profile', JSON.stringify(profile));
        }

        if (profile.name) document.getElementById('profileName').innerText = profile.name;
        if (profile.email) document.getElementById('profileEmail').innerText = profile.email;
        if (profile.location) document.getElementById('profileLocation').innerHTML = `<i class="fa-solid fa-location-dot mr-1 text-[#bcf53f]"></i> ${profile.location}`;
        if (profile.avatar_url) {
            document.getElementById('profileAvatarImg').src = profile.avatar_url;
            document.getElementById('profileAvatarImg').classList.remove('hidden');
            document.getElementById('profileAvatarIcon').classList.add('hidden');
        }

        let selectedItemToExtend = null;
        let currentItemExpiry = null;

        async function loadMyBoosts() {
            const container = document.getElementById('myBoostsContainer');
            if (!profile.email) {
                container.innerHTML = `<div class="bg-[#1e1e22] border border-zinc-800 rounded-2xl p-4 text-center text-xs text-zinc-500">Please set up your account email in <a href="setup.html" class="text-[#bcf53f] underline">Edit Account</a>.</div>`;
                return;
            }

            const { data, error } = await db.from('items').select('*').eq('user_email', profile.email);
            if (error || !data) {
                container.innerHTML = `<div class="bg-[#1e1e22] border border-zinc-800 rounded-2xl p-4 text-center text-xs text-red-400">Could not load boosts right now.</div>`;
                return;
            }

            const now = new Date();
            const activeBoosts = data.filter(item => item.is_boosted && item.boost_expires_at && new Date(item.boost_expires_at) > now);

            if (activeBoosts.length === 0) {
                container.innerHTML = `<div class="bg-[#1e1e22] border border-zinc-800 rounded-2xl p-4 text-center text-xs text-zinc-500">No active boosts. Choose "Boost Post" when sharing a bargain to pin it here!</div>`;
                return;
            }

            container.innerHTML = '';
            activeBoosts.forEach(item => {
                const expiryDate = new Date(item.boost_expires_at);
                const diffTime = expiryDate - now;
                const daysRemaining = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                const card = document.createElement('div');
                card.className = "bg-[#1e1e22] border border-[#bcf53f]/60 rounded-2xl p-4 flex items-center justify-between space-x-3 shadow-[0_0_15px_rgba(188,245,63,0.1)]";
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <img src="${item.image_url}" class="w-12 h-12 rounded-xl object-cover shrink-0 bg-zinc-900" />
                        <div class="truncate">
                            <span class="text-[#bcf53f] font-black text-sm block">${item.price}</span>
                            <span class="text-xs text-white font-bold block truncate">${item.title}</span>
                            <span class="text-[10px] text-amber-400 font-bold block"><i class="fa-solid fa-clock mr-1"></i> ${daysRemaining} day${daysRemaining > 1 ? 's' : ''} left</span>
                        </div>
                    </div>
                    <button onclick="openExtendModal('${item.id}', '${item.boost_expires_at}')" class="bg-[#bcf53f] hover:bg-[#adff2f] text-[#121214] font-black px-4 py-2.5 rounded-xl text-xs uppercase tracking-wider shrink-0 transition cursor-pointer shadow-md">
                        Renew
                    </button>
                `;
                container.appendChild(card);
            });
        }

        window.openExtendModal = function(itemId, currentExpiry) {
            selectedItemToExtend = itemId;
            currentItemExpiry = currentExpiry;
            document.getElementById('extendDaysSlider').value = 1;
            updateExtendCost(1);
            document.getElementById('extendBoostModal').classList.remove('hidden');
        }

        window.closeExtendModal = function() {
            document.getElementById('extendBoostModal').classList.add('hidden');
            selectedItemToExtend = null;
            currentItemExpiry = null;
        }

        window.updateExtendCost = function(days) {
            document.getElementById('extendDaysLabel').innerText = `${days} Day${days > 1 ? 's' : ''}`;
            const cost = (days * 0.10).toFixed(2);
            document.getElementById('extendCostLabel').innerText = `£${cost}`;
        }

        window.confirmExtendBoost = async function() {
            if (!selectedItemToExtend) return;
            const days = parseInt(document.getElementById('extendDaysSlider').value);
            const cost = (days * 0.10).toFixed(2);

            if (confirm(`🔒 Secure Checkout\n\nConfirm payment of £${cost} for ${days} day${days > 1 ? 's' : ''} boost extension?`)) {
                let baseDate = new Date(currentItemExpiry) > new Date() ? new Date(currentItemExpiry) : new Date();
                baseDate.setDate(baseDate.getDate() + days);

                const { error } = await db.from('items').update({
                    is_boosted: true,
                    boost_expires_at: baseDate.toISOString()
                }).eq('id', selectedItemToExtend);

                if (error) {
                    alert("Could not process boost renewal. Please try again.");
                } else {
                    alert("Payment successful! Boost renewed successfully 🚀");
                    closeExtendModal();
                    loadMyBoosts();
                }
            }
        }

        window.logoutUser = function() {
            profile.loggedIn = false;
            profile.email = '';
            localStorage.setItem('scout_profile', JSON.stringify(profile));
            alert("Logged out successfully.");
            window.location.href = 'setup.html';
        }

        window.clearLocalStorage = function() {
            if (confirm("Clear temporary cache? Your account quotas and active limits remain secure.")) {
                const preservedKeys = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.includes('scout_right_limit') || key.includes('scout_total_swipes') || key.includes('scout_last_swipe_date') || key.includes('scout_upload_count') || key.includes('scout_upload_month') || key.includes('scout_my_uploads') || key.includes('scout_profile')) {
                        preservedKeys[key] = localStorage.getItem(key);
                    }
                }
                localStorage.clear();
                for (const [key, value] of Object.entries(preservedKeys)) {
                    localStorage.setItem(key, value);
                }
                alert("Cache cleared successfully.");
                location.reload();
            }
        }

        loadMyBoosts();
    </script>
</body>
</html>
