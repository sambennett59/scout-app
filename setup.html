<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOUT — Edit Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { background-color: #0d0d0d; overflow-x: hidden; }
        .phone-container {
            max-width: 430px; min-height: 100vh;
            background-color: #121214; box-shadow: 0 0 24px rgba(0,0,0,0.8);
            margin: 0 auto; position: relative; padding-bottom: 110px;
        }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <div class="phone-container flex flex-col justify-between">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center px-6 pt-6 pb-2">
            <a href="profile.html" class="text-zinc-400 hover:text-white text-xl"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="text-lg font-black tracking-tight text-[#bcf53f]">EDIT ACCOUNT</h1>
            <div class="w-6"></div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="px-6 py-4 flex-grow space-y-5">
            
            <div class="space-y-1">
                <h2 class="text-2xl font-black text-white">Account Settings</h2>
                <p class="text-xs text-zinc-400">Update your profile info, location, and preferred interests.</p>
            </div>

            <!-- FORM CONTAINER -->
            <div class="space-y-4 bg-[#1e1e22] border border-zinc-800 rounded-3xl p-5 shadow-xl">
                
                <!-- NAME -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Your Name</label>
                    <input type="text" id="editName" autocomplete="name" placeholder="e.g. Samuel Bennett" class="w-full bg-[#121214] text-zinc-100 placeholder-zinc-600 px-4 py-3.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-[#bcf53f] text-sm" />
                </div>

                <!-- EMAIL -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Email Address</label>
                    <input type="email" id="editEmail" autocomplete="email" placeholder="name@example.com" class="w-full bg-[#121214] text-zinc-100 placeholder-zinc-600 px-4 py-3.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-[#bcf53f] text-sm" />
                </div>

                <!-- LOCATION -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400">Location / Area</label>
                        <button type="button" id="geoBtn" class="text-[10px] font-bold text-[#bcf53f] hover:underline flex items-center cursor-pointer">
                            <i class="fa-solid fa-location-crosshairs mr-1"></i> Auto GPS
                        </button>
                    </div>
                    <input type="text" id="editLocation" placeholder="e.g. Crediton, Devon" class="w-full bg-[#121214] text-zinc-100 placeholder-zinc-600 px-4 py-3.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-[#bcf53f] text-sm" />
                </div>

                <!-- INTERESTS / CATEGORIES -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Interests / Categories (Comma Separated)</label>
                    <input type="text" id="editInterests" placeholder="Cars, Tools, Wood" class="w-full bg-[#121214] text-zinc-100 placeholder-zinc-600 px-4 py-3.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-[#bcf53f] text-sm" />
                </div>

                <!-- ACTION BUTTON -->
                <button onclick="saveAccountChanges()" class="w-full bg-[#bcf53f] hover:bg-[#adff2f] text-[#121214] font-black uppercase tracking-wider py-4 rounded-2xl shadow-lg transition active:scale-[0.98] mt-2 cursor-pointer">
                    Save Account Changes 💾
                </button>
            </div>
        </main>

        <!-- BOTTOM TAB NAVIGATION -->
        <nav class="fixed bottom-0 w-full max-w-[430px] h-20 bg-[#121214]/90 backdrop-blur-md border-t border-zinc-900/80 flex justify-around items-center px-4 z-50">
            <a href="index.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-compass text-lg"></i>
                <span class="text-[10px] font-semibold tracking-tight">Discover</span>
            </a>
            <a href="finds.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-[10px] font-semibold tracking-tight">Finds</span>
            </a>
            <a href="radars.html" class="flex flex-col items-center space-y-1 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-bullseye text-lg"></i>
                <span class="text-[10px] font-semibold tracking-tight">Radars</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center space-y-1 text-[#bcf53f]">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-bold tracking-tight">Profile</span>
            </a>
        </nav>

    </div>

    <script>
        // Load active cached profile data into the form
        const profile = JSON.parse(localStorage.getItem('scout_profile') || '{}');
        if (profile.name) document.getElementById('editName').value = profile.name;
        if (profile.email) document.getElementById('editEmail').value = profile.email;
        if (profile.location) document.getElementById('editLocation').value = profile.location;
        document.getElementById('editInterests').value = profile.interests || 'Cars, Tools, Wood';

        document.getElementById('geoBtn').addEventListener('click', () => {
            if (!navigator.geolocation) return;
            const geoBtn = document.getElementById('geoBtn');
            geoBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Locating...`;

            navigator.geolocation.getCurrentPosition(async (position) => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}`);
                    const data = await res.json();
                    const town = data.address.town || data.address.city || data.address.village || "Crediton";
                    document.getElementById('editLocation').value = town;
                    geoBtn.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Located`;
                } catch (e) {
                    document.getElementById('editLocation').value = "Crediton, Devon";
                    geoBtn.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Located`;
                }
            }, () => { geoBtn.innerHTML = `<i class="fa-solid fa-location-crosshairs mr-1"></i> Auto GPS`; });
        });

        window.saveAccountChanges = function() {
            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const location = document.getElementById('editLocation').value.trim();
            const interests = document.getElementById('editInterests').value.trim();

            if (!name || !email) {
                alert("Please ensure your name and email are filled in.");
                return;
            }

            profile.name = name;
            profile.email = email;
            profile.location = location || 'Crediton, Devon';
            profile.interests = interests || 'Cars, Tools, Wood';
            profile.loggedIn = true;

            localStorage.setItem('scout_profile', JSON.stringify(profile));
            alert("Account details and interests updated successfully!");
            window.location.href = 'profile.html';
        };
    </script>
</body>
</html>
