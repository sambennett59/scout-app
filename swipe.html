<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCOUT — Swipe Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { scout: { dark: '#121214', card: '#1e1e22', neon: '#C6FF00', neonhover: '#adff2f' } } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background-color: #0d0d0d; overflow: hidden; touch-action: none; -webkit-tap-highlight-color: transparent; }
        .phone-container { max-width: 430px; height: 100vh; height: 100dvh; background-color: #121214; margin: 0 auto; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .swipe-card { transition: transform 0.25s ease, opacity 0.25s ease; touch-action: pan-y; }
    </style>
</head>
<body class="text-white font-sans antialiased">
    <div class="phone-container">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center px-6 pt-8 pb-4 z-20 shrink-0">
            <button onclick="window.location.href='index.html'" class="text-zinc-400 hover:text-white text-2xl cursor-pointer"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="text-center">
                <h1 class="text-xs font-black tracking-widest text-scout-neon uppercase" id="deckHeaderTitle">DISCOVER DECK</h1>
                <span class="text-[10px] text-zinc-400 font-semibold" id="cardCounter">Right Swipes: 0 of 5</span>
            </div>
            <a href="finds.html" class="relative text-zinc-400 hover:text-white text-2xl">
                <i class="fa-solid fa-heart"></i>
                <span id="findsBadge" class="absolute -top-1 -right-2 bg-scout-neon text-scout-dark text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </a>
        </header>

        <!-- SWIPE CARD CONTAINER -->
        <main class="px-6 py-2 flex-grow relative flex items-center justify-center overflow-hidden">
            <div id="cardDeck" class="w-full h-full max-h-[550px] relative flex items-center justify-center">
                <div class="text-center text-zinc-500 text-sm">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-scout-neon mb-3 block"></i>
                    Loading listings...
                </div>
            </div>

            <!-- PAYWALL MODAL (49p OR WATCH AD) -->
            <div id="paywallOverlay" class="absolute inset-0 bg-scout-dark/98 backdrop-blur-md z-[100] flex flex-col items-center justify-center p-6 text-center space-y-4 hidden">
                <div class="w-16 h-16 bg-scout-neon/10 border-2 border-scout-neon/30 text-scout-neon rounded-3xl flex items-center justify-center text-3xl shadow-lg">
                    <i class="fa-solid fa-heart-circle-bolt"></i>
                </div>
                <div class="space-y-1">
                    <h2 class="text-xl font-black text-white">Right Swipe Limit Reached</h2>
                    <p class="text-xs text-zinc-400 px-2">Unlock 1 extra right-swipe slot to continue liking items.</p>
                </div>
                
                <!-- Option 1: Pay 49p -->
                <button onclick="unlockMoreRightSwipe()" class="w-full bg-scout-neon hover:bg-scout-neonhover text-scout-dark font-black uppercase tracking-wider py-3.5 rounded-2xl shadow-lg transition text-xs flex items-center justify-center space-x-2 cursor-pointer">
                    <span>Unlock 1 Extra Swipe for 49p</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Option 2: Watch Ad for Free Swipe -->
                <button onclick="watchAdForExtraSwipe()" class="w-full bg-scout-card hover:bg-zinc-800 text-scout-neon font-bold uppercase tracking-wider py-3.5 rounded-2xl border border-scout-neon/30 transition text-xs cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Watch a short ad for 1 free swipe</span>
                </button>

                <button onclick="dismissPaywallAndSwipeLeft()" class="w-full bg-scout-card hover:bg-zinc-800 text-zinc-300 font-bold uppercase tracking-wider py-3.5 rounded-2xl border border-zinc-800 transition text-xs cursor-pointer">
                    No thanks, swipe left instead
                </button>
                <a href="finds.html" class="text-xs text-zinc-500 hover:text-white underline pt-1 block">View Saved Finds Basket</a>
            </div>
        </main>

        <!-- SWIPE ACTION BUTTONS -->
        <footer class="px-6 pb-6 pt-2 z-20 shrink-0">
            <div class="flex justify-center items-center space-x-8">
                <button onclick="swipeAction('left')" class="w-16 h-16 bg-scout-card hover:bg-zinc-800 text-red-400 border border-zinc-800 rounded-full flex items-center justify-center text-2xl shadow-lg transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button onclick="swipeAction('right')" class="w-20 h-20 bg-scout-neon hover:bg-scout-neonhover text-scout-dark rounded-full flex items-center justify-center text-3xl shadow-xl transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>
        </footer>

        <!-- BOTTOM TAB NAVIGATION -->
        <nav class="w-full h-16 bg-scout-dark border-t border-zinc-900 flex justify-around items-center px-2 shrink-0">
            <a href="index.html" class="flex flex-col items-center space-y-0.5 text-scout-neon">
                <i class="fa-solid fa-compass text-base"></i>
                <span class="text-[9px] font-bold tracking-tight">Discover</span>
            </a>
            <a href="finds.html" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-regular fa-heart text-base"></i>
                <span class="text-[9px] font-semibold tracking-tight">Finds</span>
            </a>
            <a href="radars.html" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-solid fa-bullseye text-base"></i>
                <span class="text-[9px] font-semibold tracking-tight">Radars</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition">
                <i class="fa-regular fa-user text-base"></i>
                <span class="text-[9px] font-semibold tracking-tight">Profile</span>
            </a>
        </nav>

    </div>

    <script>
        const supabaseUrl = 'https://aiojzwzykvuaxepfjwhr.supabase.co';
        const supabaseKey = 'sb_publishable_jZmHhXFrFBvpqGRjqBlBEg_uZ_TtQyA';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let items = [];
        let currentIndex = 0;
        let rightSwipeLimit = parseInt(localStorage.getItem('scout_right_limit') || '5');
        let totalRightSwipes = parseInt(localStorage.getItem('scout_total_swipes') || '0');
        
        function updateUI() {
            let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
            document.getElementById('findsBadge').innerText = currentFinds.length;
            document.getElementById('cardCounter').innerText = `Right Swipes: ${totalRightSwipes} of ${rightSwipeLimit}`;
        }
        updateUI();

        async function loadDeck() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const searchQuery = urlParams.get('q');

            if (mode === 'surprise') {
                document.getElementById('deckHeaderTitle').innerText = `SURPRISE DECK`;
                const { data, error } = await db.from('items').select('*');
                
                if (error || !data || data.length === 0) {
                    document.getElementById('cardDeck').innerHTML = `<div class="text-xs text-red-400">No listings found in database.</div>`;
                    return;
                }
                
                items = data.sort(() => Math.random() - 0.5);
                currentIndex = 0;
                renderCard();
                return;
            }

            if (searchQuery) {
                document.getElementById('deckHeaderTitle').innerText = `SEARCH: "${searchQuery}"`;
                document.getElementById('cardDeck').innerHTML = `
                    <div class="text-center text-zinc-500 text-sm">
                        <i class="fa-solid fa-brain fa-pulse text-3xl text-scout-neon mb-3 block"></i>
                        AI is finding related bargains...
                    </div>
                `;

                try {
                    const { data: embedData, error: embedError } = await db.functions.invoke('GET_EMBEDDING', {
                        body: { text: searchQuery }
                    });

                    if (embedError || !embedData || !embedData.embedding) {
                        showNoMatches(searchQuery);
                        return;
                    }

                    const { data: matchedItems, error } = await db.rpc('match_items', {
                        query_embedding: embedData.embedding,
                        match_threshold: -0.5, 
                        match_count: 50
                    });

                    if (error || !matchedItems || matchedItems.length === 0) {
                        showNoMatches(searchQuery);
                        return;
                    }
                    
                    items = matchedItems;
                    currentIndex = 0;
                } catch (e) {
                    document.getElementById('cardDeck').innerHTML = `<div class="text-xs text-red-400">Error connecting to AI Search.</div>`;
                    return;
                }
                renderCard();
                return;
            }

            const { data, error } = await db.from('items').select('*');
            if (error || !data || data.length === 0) {
                document.getElementById('cardDeck').innerHTML = `<div class="text-xs text-red-400">No listings found in database.</div>`;
                return;
            }
            items = data;
            currentIndex = 0;
            renderCard();
        }

        function showNoMatches(searchQuery) {
            document.getElementById('cardDeck').innerHTML = `
                <div class="text-center space-y-4">
                    <div class="w-16 h-16 bg-scout-card border border-zinc-800 rounded-2xl flex items-center justify-center mx-auto text-3xl text-zinc-600 shadow-inner">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-black text-lg">No matches found</h3>
                        <p class="text-zinc-500 text-xs">Nothing related to "${searchQuery}" found.</p>
                    </div>
                    <button onclick="window.location.href='swipe.html'" class="mt-2 bg-scout-neon hover:bg-scout-neonhover text-scout-dark font-bold text-xs uppercase tracking-wider px-6 py-3 rounded-xl transition cursor-pointer">
                        View Full Deck
                    </button>
                </div>
            `;
        }

        function renderCard() {
            const deckContainer = document.getElementById('cardDeck');

            if (currentIndex >= items.length) {
                deckContainer.innerHTML = `
                    <div class="text-center space-y-4">
                        <div class="w-16 h-16 bg-scout-card border border-zinc-800 rounded-2xl flex items-center justify-center mx-auto text-3xl text-zinc-600 shadow-inner">
                            <i class="fa-solid fa-ghost"></i>
                        </div>
                        <div>
                            <h3 class="text-white font-black text-lg">You've seen it all!</h3>
                            <p class="text-zinc-500 text-xs">No more listings left in this stack.</p>
                        </div>
                        <button onclick="window.location.href='index.html'" class="mt-2 bg-scout-neon hover:bg-scout-neonhover text-scout-dark font-bold text-xs uppercase tracking-wider px-6 py-3 rounded-xl transition cursor-pointer">
                            Back to Discover
                        </button>
                    </div>
                `;
                return;
            }

            updateUI();
            const item = items[currentIndex];

            deckContainer.innerHTML = `
                <div id="activeSwipeCard" class="swipe-card absolute inset-0 bg-scout-card border border-zinc-800 rounded-3xl overflow-hidden flex flex-col justify-between shadow-2xl">
                    <div class="relative w-full h-[65%] bg-zinc-900">
                        <img src="${item.image_url}" class="w-full h-full object-cover" />
                        <span class="absolute top-4 left-4 bg-scout-dark/80 backdrop-blur-md text-scout-neon border border-zinc-800 text-sm font-black px-4 py-2 rounded-full uppercase tracking-wider shadow-lg">
                            ${item.price}
                        </span>
                    </div>
                    <div class="p-5 flex flex-col justify-between h-[35%] bg-gradient-to-t from-scout-card to-scout-dark">
                        <div class="space-y-1">
                            <h2 class="text-lg font-black text-white leading-snug line-clamp-2">${item.title}</h2>
                            <p class="text-sm text-zinc-400"><i class="fa-solid fa-location-dot mr-1 text-scout-neon"></i>${item.location}</p>
                        </div>
                        <div class="flex justify-between items-center pt-3 border-t border-zinc-800/80">
                            <span class="text-xs font-bold text-scout-neon flex items-center"><i class="fa-solid fa-tags mr-1"></i> Deck Card</span>
                            <span class="text-[10px] text-zinc-500 uppercase font-black tracking-widest">Swipe Left/Right</span>
                        </div>
                    </div>
                </div>
            `;

            initTouchGestures();
        }

        window.swipeAction = function(direction) {
            const card = document.getElementById('activeSwipeCard');
            if (!card) return;

            if (direction === 'right') {
                // 1. Immediately save item to basket
                let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
                const item = items[currentIndex];
                if (!currentFinds.some(f => f.title === item.title)) {
                    currentFinds.push(item);
                    localStorage.setItem('scout_liked_items', JSON.stringify(currentFinds));
                }

                // 2. Increment total swipes count
                totalRightSwipes++;
                localStorage.setItem('scout_total_swipes', totalRightSwipes);
                updateUI();

                // 3. If we've exceeded the limit, show paywall modal
                if (totalRightSwipes > rightSwipeLimit) {
                    document.getElementById('paywallOverlay').classList.remove('hidden');
                    return; 
                }

                card.style.transform = 'translateX(400px) rotate(20deg)';
            } else {
                card.style.transform = 'translateX(-400px) rotate(-20deg)';
            }
            card.style.opacity = '0';

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 250);
        }

        window.unlockMoreRightSwipe = function() {
            if (confirm("Confirm 49p payment for 1 extra right-swipe slot?")) {
                rightSwipeLimit += 1;
                localStorage.setItem('scout_right_limit', rightSwipeLimit);
                document.getElementById('paywallOverlay').classList.add('hidden'); 
                
                let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
                const item = items[currentIndex];
                if (!currentFinds.some(f => f.title === item.title)) {
                    currentFinds.push(item);
                    localStorage.setItem('scout_liked_items', JSON.stringify(currentFinds));
                }

                totalRightSwipes++;
                localStorage.setItem('scout_total_swipes', totalRightSwipes);
                updateUI();

                const card = document.getElementById('activeSwipeCard');
                if (card) {
                    card.style.transform = 'translateX(400px) rotate(20deg)';
                    card.style.opacity = '0';
                }

                setTimeout(() => {
                    currentIndex++;
                    renderCard();
                }, 250);
            }
        }

        window.watchAdForExtraSwipe = function() {
            alert("Playing short partner ad...");
            setTimeout(() => {
                rightSwipeLimit += 1;
                localStorage.setItem('scout_right_limit', rightSwipeLimit);
                document.getElementById('paywallOverlay').classList.add('hidden');

                let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
                const item = items[currentIndex];
                if (!currentFinds.some(f => f.title === item.title)) {
                    currentFinds.push(item);
                    localStorage.setItem('scout_liked_items', JSON.stringify(currentFinds));
                }

                totalRightSwipes++;
                localStorage.setItem('scout_total_swipes', totalRightSwipes);
                updateUI();

                const card = document.getElementById('activeSwipeCard');
                if (card) {
                    card.style.transform = 'translateX(400px) rotate(20deg)';
                    card.style.opacity = '0';
                }

                setTimeout(() => {
                    currentIndex++;
                    renderCard();
                }, 250);
            }, 1000);
        }

        window.dismissPaywallAndSwipeLeft = function() {
            document.getElementById('paywallOverlay').classList.add('hidden');
            swipeAction('left');
        }

        function initTouchGestures() {
            const card = document.getElementById('activeSwipeCard');
            if (!card) return;

            let startX = 0;
            let currentX = 0;

            card.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                card.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                const diff = currentX - startX;
                if (Math.abs(diff) > 100) {
                    swipeAction(diff > 0 ? 'right' : 'left');
                } else {
                    card.style.transform = 'translateX(0) rotate(0)';
                }
            });
        }

        loadDeck();
    </script>
</body>
</html>
