<script>
    const supabaseUrl = 'https://aiojzwzykvuaxepfjwhr.supabase.co';
    const supabaseKey = 'sb_publishable_jZmHhXFrFBvpqGRjqBlBEg_uZ_TtQyA';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    let items = [];
    let currentIndex = 0;

    const profile = JSON.parse(localStorage.getItem('scout_profile') || '{}');
    const userEmail = profile.email || 'anonymous_user@scout.local';

    let rightSwipeLimit = 5;
    let totalRightSwipes = 0;
    const todayStr = new Date().toISOString().split('T')[0];

    async function syncSwipeQuotas() {
        try {
            let { data, error } = await db.from('profiles').select('*').eq('email', userEmail).maybeSingle();

            if (!data) {
                const { data: newProfile } = await db.from('profiles').insert([{
                    email: userEmail,
                    upload_count: 0,
                    upload_month: new Date().toISOString().substring(0, 7),
                    right_swipes: 0,
                    swipe_date: todayStr
                }]).select().maybeSingle();
                data = newProfile;
            }

            if (data) {
                if (data.swipe_date !== todayStr) {
                    await db.from('profiles').update({ right_swipes: 0, swipe_date: todayStr }).eq('email', userEmail);
                    totalRightSwipes = 0;
                } else {
                    totalRightSwipes = data.right_swipes || 0;
                }
            }
        } catch (e) {
            console.log("Quota sync fallback active:", e);
        }
        updateUI();
    }
    syncSwipeQuotas();

    function updateUI() {
        let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
        document.getElementById('findsBadge').innerText = currentFinds.length;
        document.getElementById('cardCounter').innerText = `Daily Swipes: ${totalRightSwipes} of ${rightSwipeLimit}`;
    }

    async function loadDeck() {
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const searchQuery = urlParams.get('q');

        if (mode === 'surprise') {
            document.getElementById('deckHeaderTitle').innerText = `SURPRISE DECK`;
        }

        const { data, error } = await db.from('items').select('*');
        if (error || !data || data.length === 0) {
            document.getElementById('cardDeck').innerHTML = `<div class="text-xs text-red-400">No listings found in database.</div>`;
            return;
        }

        const now = new Date();
        items = data.sort((a, b) => {
            const aBoosted = a.is_boosted && a.boost_expires_at && new Date(a.boost_expires_at) > now;
            const bBoosted = b.is_boosted && b.boost_expires_at && new Date(b.boost_expires_at) > now;
            
            if (aBoosted && !bBoosted) return -1;
            if (!aBoosted && bBoosted) return 1;
            
            if (mode === 'surprise') return Math.random() - 0.5;
            return new Date(b.created_at || 0) - new Date(a.created_at || 0);
        });

        currentIndex = 0;
        renderCard();
    }

    function renderCard() {
        const deckContainer = document.getElementById('cardDeck');

        if (currentIndex >= items.length) {
            deckContainer.innerHTML = `
                <div class="text-center space-y-4">
                    <div class="w-16 h-16 bg-scout-card border border-zinc-800 rounded-2xl flex items-center justify-center mx-auto text-3xl text-zinc-600 shadow-inner">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-black text-lg">You've seen it all!</h3>
                        <p class="text-zinc-500 text-xs">No more listings left in this stack.</p>
                    </div>
                    <button onclick="window.location.href='index.html'" class="mt-2 bg-scout-neon hover:bg-scout-neonhover text-scout-dark font-bold text-xs uppercase tracking-wider px-6 py-3 rounded-xl transition cursor-pointer">
                        Back to Discover
                    </button>
                </div>
            `;
            return;
        }

        updateUI();
        const item = items[currentIndex];
        const isRestricted = item.is_restricted === true;
        const isBoosted = item.is_boosted && item.boost_expires_at && new Date(item.boost_expires_at) > new Date();

        deckContainer.innerHTML = `
            <div id="activeSwipeCard" class="swipe-card absolute inset-0 bg-scout-card border ${isBoosted ? 'border-scout-neon shadow-[0_0_20px_rgba(198,255,0,0.2)]' : 'border-zinc-800'} rounded-3xl overflow-hidden flex flex-col justify-between shadow-2xl">
                <div class="relative w-full h-[65%] bg-zinc-900 overflow-hidden">
                    <img id="cardImage" src="${item.image_url}" class="w-full h-full object-cover transition duration-300 ${isRestricted ? 'filter blur-2xl scale-110' : ''}" />
                    
                    <span class="absolute top-4 left-4 bg-scout-dark/85 backdrop-blur-md text-scout-neon border border-zinc-800 text-sm font-black px-4 py-2 rounded-full uppercase tracking-wider shadow-lg z-10">
                        ${item.price}
                    </span>

                    ${isBoosted ? `
                        <span class="absolute top-4 right-4 bg-scout-neon text-scout-dark text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-wider shadow-lg z-10 flex items-center space-x-1">
                            <i class="fa-solid fa-rocket"></i><span>Boosted</span>
                        </span>
                    ` : ''}

                    ${isRestricted ? `
                        <div id="blurWarningOverlay" onclick="revealRestrictedContent(event)" class="absolute inset-0 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center cursor-pointer z-20">
                            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-3xl mb-2"></i>
                            <h3 class="text-white font-black text-sm uppercase tracking-wide">18+ Restricted Content</h3>
                            <p class="text-zinc-400 text-[10px] mt-1">Tobacco / Age-Restricted. Tap anywhere to reveal image.</p>
                        </div>
                    ` : ''}
                </div>

                <div class="p-5 flex flex-col justify-between h-[35%] bg-gradient-to-t from-scout-card to-scout-dark">
                    <div class="space-y-1">
                        <h2 class="text-lg font-black text-white leading-snug line-clamp-2">${item.title}</h2>
                        <p class="text-sm text-zinc-400"><i class="fa-solid fa-location-dot mr-1 text-scout-neon"></i>${item.location}</p>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-zinc-800/80">
                        <span class="text-xs font-bold text-scout-neon flex items-center"><i class="fa-solid fa-tags mr-1"></i> Deck Card</span>
                        <span class="text-[10px] text-zinc-500 uppercase font-black tracking-widest">Swipe Left/Right</span>
                    </div>
                </div>
            </div>
        `;

        initTouchGestures();
    }

    window.revealRestrictedContent = function(e) {
        e.stopPropagation();
        const img = document.getElementById('cardImage');
        const overlay = document.getElementById('blurWarningOverlay');
        if (img) img.classList.remove('filter', 'blur-2xl', 'scale-110');
        if (overlay) overlay.style.display = 'none';
    }

    window.swipeAction = async function(direction) {
        const card = document.getElementById('activeSwipeCard');
        if (!card) return;

        if (direction === 'right') {
            if (totalRightSwipes >= rightSwipeLimit) {
                document.getElementById('paywallOverlay').classList.remove('hidden');
                return;
            }

            const currentItem = items[currentIndex];
            const likedItem = {
                title: currentItem.title || 'Untitled Item',
                price: currentItem.price || '£0.00',
                location: currentItem.location || 'Local',
                image_url: currentItem.image_url || '',
                external_link: currentItem.external_link || '#'
            };

            let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
            if (!currentFinds.some(f => f.title === likedItem.title)) {
                currentFinds.push(likedItem);
                localStorage.setItem('scout_liked_items', JSON.stringify(currentFinds));
            }

            totalRightSwipes++;
            await db.from('profiles').update({ right_swipes: totalRightSwipes }).eq('email', userEmail);
            updateUI();

            if (totalRightSwipes > rightSwipeLimit) {
                document.getElementById('paywallOverlay').classList.remove('hidden');
                return;
            }

            card.style.transform = 'translateX(400px) rotate(20deg)';
        } else {
            card.style.transform = 'translateX(-400px) rotate(-20deg)';
        }
        card.style.opacity = '0';

        setTimeout(() => {
            currentIndex++;
            renderCard();
        }, 250);
    }

    window.unlockMoreRightSwipe = async function() {
        if (confirm("Confirm 49p payment for 1 extra daily right-swipe slot?")) {
            rightSwipeLimit += 1;
            document.getElementById('paywallOverlay').classList.add('hidden'); 
            
            let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
            const currentItem = items[currentIndex];
            const likedItem = {
                title: currentItem.title || 'Untitled Item',
                price: currentItem.price || '£0.00',
                location: currentItem.location || 'Local',
                image_url: currentItem.image_url || '',
                external_link: currentItem.external_link || '#'
            };
            if (!currentFinds.some(f => f.title === likedItem.title)) {
                currentFinds.push(likedItem);
                localStorage.setItem('scout_liked_items', JSON.stringify(currentFinds));
            }

            totalRightSwipes++;
            await db.from('profiles').update({ right_swipes: totalRightSwipes }).eq('email', userEmail);
            updateUI();

            const card = document.getElementById('activeSwipeCard');
            if (card) {
                card.style.transform = 'translateX(400px) rotate(20deg)';
                card.style.opacity = '0';
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 250);
        }
    }

    window.watchAdForExtraSwipe = async function() {
        alert("Playing short partner ad...");
        setTimeout(async () => {
            rightSwipeLimit += 1;
            document.getElementById('paywallOverlay').classList.add('hidden');

            let currentFinds = JSON.parse(localStorage.getItem('scout_liked_items') || '[]');
            const currentItem = items[currentIndex];
            const likedItem = {
                title: currentItem.title || 'Untitled Item',
                price: currentItem.price || '£0.00',
                location: currentItem.location || 'Local',
                image_url: currentItem.image_url || '',
                external_link: currentItem.external_link || '#'
            };
            if (!currentFinds.some(f => f.title === likedItem.title)) {
                currentFinds.push(likedItem);
                localStorage.setItem('scout_liked_items', JSON.stringify(currentFinds));
            }

            totalRightSwipes++;
            await db.from('profiles').update({ right_swipes: totalRightSwipes }).eq('email', userEmail);
            updateUI();

            const card = document.getElementById('activeSwipeCard');
            if (card) {
                card.style.transform = 'translateX(400px) rotate(20deg)';
                card.style.opacity = '0';
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 250);
        }, 1000);
    }

    window.dismissPaywallAndSwipeLeft = function() {
        document.getElementById('paywallOverlay').classList.add('hidden');
        swipeAction('left');
    }

    function initTouchGestures() {
        const card = document.getElementById('activeSwipeCard');
        if (!card) return;

        let startX = 0;
        let currentX = 0;

        card.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
            currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            card.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
        }, { passive: true });

        card.addEventListener('touchend', (e) => {
            const diff = currentX - startX;
            if (Math.abs(diff) > 100) {
                swipeAction(diff > 0 ? 'right' : 'left');
            } else {
                card.style.transform = 'translateX(0) rotate(0)';
            }
        });
    }

    loadDeck();
</script>
